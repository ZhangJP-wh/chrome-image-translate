<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>图片翻译 · 设置</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 14px/1.55 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: #202124;
        background: #f8f9fa;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      header img { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 22px; font-weight: 650; }
      h2 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 650;
      }
      .card {
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      #engine-settings.focus-target {
        border-color: #1a73e8;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.28);
        background: #e8f0fe;
        animation: cit-pulse 0.9s ease 0s 2;
      }
      @keyframes cit-pulse {
        0%, 100% { box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.28); }
        50% { box-shadow: 0 0 0 7px rgba(26, 115, 232, 0.08); }
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        cursor: pointer;
      }
      #menu-hint, .hint {
        margin: 8px 0 0;
        color: #5f6368;
        font-size: 13px;
      }
      .hint { margin-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon32.png" alt="">
        <h1>图片翻译 · 设置</h1>
      </header>
      <section id="engine-settings" class="card">
        <h2>右键菜单里显示</h2>
        <label><input id="engine-google" type="checkbox"> 谷歌翻译</label>
        <label><input id="engine-bing" type="checkbox"> 必应翻译（中国大陆通常可用）</label>
        <p id="menu-hint"></p>
      </section>
      <section class="card">
        <p class="hint">只勾选一项时，该项会直接出现在右键一级菜单，没有二级菜单。两项都勾选时，会出现「翻译」二级菜单（这是 Chrome 的限制）。至少要保留一个翻译选项。</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
