<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>图片翻译</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        width: 280px;
        font: 13px/1.55 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: #202124;
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
      }
      header img { width: 24px; height: 24px; }
      h1 { margin: 0; font-size: 15px; font-weight: 650; }
      ol, p { margin: 0; }
      ol { padding: 0 14px 12px 32px; }
      li { margin: 4px 0; }
      .hint {
        padding: 8px 14px 14px;
        color: #5f6368;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="">
      <h1>图片翻译</h1>
    </header>
    <ol>
      <li>在网页的图片上右键，或先选中文字再右键</li>
      <li>在「翻译」子菜单里选择「谷歌翻译」或「必应翻译」（后者在中国大陆通常可用，无需申请密钥）</li>
      <li>图片：简体中文会覆盖在原图对应文字上。选中的文字：尽量覆盖在原句位置；无法覆盖时，会在当前页弹出译文（不会打开新标签）</li>
      <li>可用「显示原文 / 显示译文」切换，或点「关闭」去掉覆盖层或弹窗</li>
    </ol>
    <p class="hint">第一次翻译图片可能需要几秒来加载识别组件。请尽量选择文字清晰的图片。输入框里的选中文字会以弹窗显示译文。</p>
  </body>
</html>
